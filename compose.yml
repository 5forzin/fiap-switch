services:
  web:
    image: fiap-switch:latest
    build: .
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env}
    ports:
      - "127.0.0.1:${WEB_PORT:-4341}:8000"
    volumes:
      - switch-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  switch-data:
